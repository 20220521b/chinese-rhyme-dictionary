<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>中文押韻字典</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>中文押韻字典</h1>

    <p>給作詞與創作使用的繁體中文押韻工具</p>

    <h4>選擇聲母</h4>

    <select id="initial">
        <option  value="">請選擇聲母</option>
        <option  value="all">不限聲母</option>
        <option  value="ㄅ">ㄅ</option>
        <option  value="ㄆ">ㄆ</option>
        <option  value="ㄇ">ㄇ</option>
        <option  value="ㄈ">ㄈ</option>
        <option  value="ㄉ">ㄉ</option>
        <option  value="ㄊ">ㄊ</option>
        <option  value="ㄋ">ㄋ</option>
        <option  value="ㄌ">ㄌ</option>
        <option  value="ㄍ">ㄍ</option>
        <option  value="ㄎ">ㄎ</option>
        <option  value="ㄏ">ㄏ</option>
        <option  value="ㄐ">ㄐ</option>
        <option  value="ㄑ">ㄑ</option>
        <option  value="ㄒ">ㄒ</option>
        <option  value="ㄓ">ㄓ</option>
        <option  value="ㄔ">ㄔ</option>
        <option  value="ㄕ">ㄕ</option>
        <option  value="ㄖ">ㄖ</option>
        <option  value="ㄗ">ㄗ</option>
        <option  value="ㄘ">ㄘ</option>
        <option  value="ㄙ">ㄙ</option>
    </select>

    <h4>選擇介音</h4>

    <select id="medial">
        <option value="">請選擇介音</option>
        <option value="all">不限介音</option>
        <option value="ㄧ">ㄧ</option>
        <option value="ㄨ">ㄨ</option>
        <option value="ㄩ">ㄩ</option>
    </select>

    <h4>選擇韻母</h4>
 
    <select id="final">
        <option value="">請選擇韻母</option>
        <option value="all">不限韻母</option>
        <option value="ㄚ">ㄚ</option>
        <option value="ㄛ">ㄛ</option>
        <option value="ㄜ">ㄜ</option>
        <option value="ㄝ">ㄝ</option>
        <option value="ㄞ">ㄞ</option>
        <option value="ㄟ">ㄟ</option>
        <option value="ㄠ">ㄠ</option>
        <option value="ㄡ">ㄡ</option>
        <option value="ㄢ">ㄢ</option>
        <option value="ㄣ">ㄣ</option>
        <option value="ㄤ">ㄤ</option>
        <option value="ㄥ">ㄥ</option>
        <option value="ㄦ">ㄦ</option>
    </select>

    <h4>選擇聲調</h4>

    <select id="tone">
        <option value="">請選擇聲調</option>
        <option value="all">不限聲調</option>
        <option value="1">一聲</option>
        <option value="2">ˊ</option>
        <option value="3">ˇ</option>
        <option value="4">ˋ</option>
        <option value="5">˙</option>
    </select>

    <h4>選擇詞性</h4>

    <select id="partOfSpeech">
        <option value="">請選擇詞性</option>
        <option value="all">不限詞性</option>
        <option value="名詞">名詞</option>
        <option value="動詞">動詞</option>
        <option value="形容詞">形容詞</option>
        <option value="副詞">副詞</option>
    </select>


    <button onclick="searchWords()">搜尋</button>
    <div id="results"></div>

</body>
</html>
